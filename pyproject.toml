[project]
name = "papermind"
version = "0.1.0"
description = "Research paper triage & synthesis pipeline (learning project for OpenAI Structured Outputs + PydanticAI)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.7",
    "pydantic-ai>=0.5",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papermind"]
